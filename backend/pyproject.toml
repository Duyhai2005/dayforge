[project]
name = "dayforge-backend"
version = "0.0.0"
requires-python = "==3.14.10"
dependencies = [
    "aiomysql[rsa]==0.3.2",
    # aiomysql 0.3.2 calls escape_bytes_prefixed, removed as a callable in PyMySQL 1.2.3.
    # Keep utf8mb4 enforced in build_database_url; legacy multibyte charsets are unsupported.
    "pymysql==1.1.3",
    "alembic==1.19.2",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["mysql: requires the isolated MySQL test runner"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.14"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[dependency-groups]
dev = [
    "black==26.10.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
