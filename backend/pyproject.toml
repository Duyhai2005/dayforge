[project]
name = "dayforge-backend"
version = "0.0.0"
requires-python = "==3.14.10"
dependencies = [
    "aiomysql[rsa]==0.3.2",
    "alembic==1.19.2",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["mysql: requires the isolated MySQL test runner"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
]
