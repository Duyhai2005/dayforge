 const mo=e.target.closest('[data-month]');if(mo){transition(()=>{state.focus=new Date(state.focus.getFullYear(),Number(mo.dataset.month),1);state.scale='month';});return;}
 const fc=e.target.closest('[data-focus]');if(fc){state.focus=date(fc.dataset.focus);openComposer('milestone',{date:fc.dataset.focus});return;}
 const day=e.target.closest('[data-day]');if(day){openDay(date(day.dataset.day));return;}
 const blankDay=e.target.closest('.month-day');if(blankDay){const anchor=blankDay.querySelector('[data-focus]');if(anchor)openComposer('milestone',{date:anchor.dataset.focus});return;}
 if(e.target===el('event-overlay')){closeEditor();return;}if(!e.target.closest('.navigator'))closeNav();
});
let pointer=null;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('[data-task]');if(!card||e.button!==0||!el('event-overlay').hidden)return;const r=card.getBoundingClientRect();pointer={id:card.dataset.task,card,startX:e.clientX,startY:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,width:r.width,active:false,ghost:null,slot:null,before:null};card.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!pointer)return;const p=pointer;if(!p.active&&Math.hypot(e.clientX-p.startX,e.clientY-p.startY)<7)return;if(!p.active){p.active=true;p.card.classList.add('dragging');p.ghost=p.card.cloneNode(true);p.ghost.classList.remove('dragging');p.ghost.classList.add('drag-ghost');p.ghost.style.width=p.width+'px';p.ghost.setAttribute('aria-hidden','true');document.body.append(p.ghost);el('drag-notice').hidden=false;}e.preventDefault();p.ghost.style.left=(e.clientX-p.dx)+'px';p.ghost.style.top=(e.clientY-p.dy)+'px';document.querySelectorAll('.drop-active,.drop-before').forEach(n=>n.classList.remove('drop-active','drop-before'));const hit=document.elementFromPoint(e.clientX,e.clientY),slot=hit?.closest('[data-slot]'),before=hit?.closest('[data-task]');p.slot=slot;p.before=before&&before.dataset.task!==p.id?before.dataset.task:null;slot?.classList.add('drop-active');if(p.before)before.classList.add('drop-before');el('drag-notice').textContent=slot?`Thả vào ${P[Number(slot.dataset.period)].toLowerCase()}, ${date(slot.dataset.slot).getDate()}/${date(slot.dataset.slot).getMonth()+1}`:'Kéo vào một buổi trong lịch';const week=slot?.closest('.week');if(week){const r=week.getBoundingClientRect();if(e.clientY>r.bottom-30)week.scrollTop+=8;if(e.clientY<r.top+30)week.scrollTop-=8;}},{passive:false});
function finishDrag(cancel=false){if(!pointer)return;const p=pointer;pointer=null;p.ghost?.remove();p.card.classList.remove('dragging');el('drag-notice').hidden=true;document.querySelectorAll('.drop-active,.drop-before').forEach(n=>n.classList.remove('drop-active','drop-before'));if(p.active){suppressClickUntil=Date.now()+500;if(p.slot&&!cancel)moveTask(p.id,p.slot.dataset.slot,Number(p.slot.dataset.period),p.before);}}
document.addEventListener('pointerup',()=>finishDrag());document.addEventListener('pointercancel',()=>finishDrag(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pointer)finishDrag(true);else if(!el('event-overlay').hidden)closeEditor();else if(dayOpen){dayOpen=null;el('day-sheet').hidden=true;}else closeNav();}if(e.key==='Tab'&&!el('event-overlay').hidden){const nodes=[...el('event-overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),summary')].filter(n=>n.offsetParent!==null),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});

function balanceDayparts(){
 const week=el('scene').querySelector('.week');if(!week)return;
 const markers=[...week.querySelectorAll('.day-milestones')];markers.forEach(node=>node.style.minHeight='0px');
 const markerHeight=Math.max(25,...markers.map(node=>node.scrollHeight));markers.forEach(node=>node.style.minHeight=markerHeight+'px');
 const heading=week.querySelector('.day-heading'),labels=week.querySelector('.period-labels');
 if(heading&&labels)labels.style.paddingTop=(heading.getBoundingClientRect().height+parseFloat(getComputedStyle(heading).marginBottom)+markerHeight)+'px';
 for(let p=0;p<3;p++){const slots=[...week.querySelectorAll('[data-slot][data-period="'+p+'"]')];slots.forEach(node=>node.style.minHeight='0px');const height=Math.max(86,...slots.map(node=>node.scrollHeight));slots.forEach(node=>node.style.minHeight=height+'px');if(labels?.children[p])labels.children[p].style.height=height+'px';}
}

function fit(){el('canvas').style.transform='none';el('viewport').style.width='100%';el('viewport').style.height='auto';el('small-frame-note').style.display='none';balanceDayparts();}
render();fit();addEventListener('resize',fit);
})();

</script></body></html>
