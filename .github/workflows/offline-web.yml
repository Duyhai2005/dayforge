name: Offline web shell

on:
  pull_request:
  push:

jobs:
  offline-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dayforge/frontend exec playwright install --with-deps chromium
      - name: Verify Playwright suite isolation
        run: pnpm verify:web-discovery
      - name: Build production shell
        run: pnpm build:web
      - name: Run production offline suite
        run: pnpm test:web:offline
      - name: Run same-origin A/B update suite
        run: pnpm test:web:offline:update
